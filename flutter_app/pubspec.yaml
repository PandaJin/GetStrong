name: getstrong
description: GetStrong - AI 健康助手应用
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Image
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0

  # Charts
  fl_chart: ^0.68.0

  # UI Components
  shimmer: ^3.0.0
  flutter_svg: ^2.0.0
  flutter_markdown: ^0.7.0

  # Utils
  intl: ^0.19.0
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0
  equatable: ^2.0.0
  uuid: ^4.3.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
